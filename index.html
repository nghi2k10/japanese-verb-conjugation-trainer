<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Japanese Verb Conjugation Trainer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Segoe UI",
        "Noto Sans JP",
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #1f2937;
    }

    .app {
      width: min(900px, 94%);
      margin: 40px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      color: #6b7280;
      margin-top: 8px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    /* =========================
       FORM SELECT
    ========================= */

    .settings {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      gap: 15px;
      align-items: end;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #4b5563;
    }

    select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      font-size: 16px;
      cursor: pointer;
    }

    .arrow {
      text-align: center;
      font-size: 28px;
      padding-bottom: 5px;
    }

    /* =========================
       LESSON GRID
    ========================= */

    .lesson-hint {
      margin: 0 0 14px;
      font-size: 13px;
      color: #9ca3af;
    }

    .lesson-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .lesson-tool-btn {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #d1d5db;
      background: white;
      color: #4b5563;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s;
    }

    .lesson-tool-btn:hover {
      background: #f3f4f6;
    }

    .lesson-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 480px) {
      .lesson-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      border: none;
      border-radius: 12px;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: #14808a;
      cursor: pointer;
      transition: 0.15s;
    }

    .lesson-btn:hover {
      background: #106b73;
    }

    .lesson-btn.selected {
      background: #0d4f56;
      box-shadow: 0 0 0 3px #99e6e0 inset;
    }

    .lesson-btn.disabled {

      color: #9ca3af;
      cursor: not-allowed;
    }

    .lesson-btn.disabled:hover {
      background: #d1d5db;
    }

       QUESTION
    ========================= */

      padding: 20px 0 30px;

    .question-label {

      font-size: 14px;
    }

    .verb {
      font-size: 42px;
      font-weight: 700;

    }

      Hiragana dưới Kanji

      font-size: 22px;
      color: #6366f1;

    }

      font-size: 16px;

      background: #eef2ff;
      color: #4f46e5;

    ========================= */

    .answer-area {
      margin-top: 15px;
    }

    .answer-input {

      padding: 16px;
      font-size: 24px;
      text-align: center;

      border: 2px solid #d1d5db;
      border-radius: 12px;

    }

      background: #f0fdf4;
      color: #15803d;
    }

    .answer-input.wrong {
      border-color: #ef4444;
      background: #fef2f2;
      color: #dc2626;
    }

    .converted {
      text-align: center;
      margin-top: 10px;

      min-height: 30px;

      font-size: 20px;
      color: #6b7280;
    }

    .result {
      text-align: center;

      font-size: 20px;
      font-weight: 700;

      margin-top: 10px;
    }

    .result.correct {
      color: #16a34a;
    }

    .result.wrong {
      color: #dc2626;
    }

    .correct-answer {
      text-align: center;

      margin-top: 8px;

      color: #dc2626;

      font-size: 18px;
    }

    /* =========================
       BUTTON
    ========================= */

    .buttons {
      display: flex;
      justify-content: center;

      gap: 12px;

      margin-top: 20px;
    }

    button {
      border: none;

      padding: 13px 25px;

      border-radius: 10px;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

    .btn-check {
      background: #4f46e5;
      color: white;
    }

      background: #4338ca;
    }

    .btn-next {
      background: #111827;
      color: white;
    }

    .btn-next:hover {
      background: #000;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;
    }

    .stat {
      text-align: center;

      background: #f9fafb;

      padding: 18px;

      border-radius: 12px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
    }

    .stat-label {
      color: #6b7280;
      font-size: 13px;

      margin-top: 4px;
    }

    .progress {
      margin-top: 18px;

      background: #e5e7eb;

      border-radius: 10px;

      overflow: hidden;
    }

      height: 100%;

      width: 0%;

      background: #22c55e;

  ro: "ろ",

  wa: "わ",
  wo: "を",

  a: "あ",
  i: "い",
  u: "う",
  e: "え",
  o: "お",

  n: "ん"
};


function romajiToHiragana(text) {

  text = text
    .toLowerCase()
    .replace(/\s+/g, "");

  let result = "";

  let i = 0;


  while (i < text.length) {

    /*
      Double consonant

      katta
      ↓
      かった
    */

    if (
      i + 1 < text.length &&
      text[i] === text[i + 1] &&
      !"aeioun".includes(text[i])
    ) {

      result += "っ";

      i++;

      continue;
    }


    let found = false;


    /*
      Ưu tiên 3 ký tự
      → 2 ký tự
      → 1 ký tự
    */

    for (
      let len = 3;
      len >= 1;
      len--
    ) {

      const part =
        text.substring(i, i + len);


      if (romajiMap[part]) {

        result += romajiMap[part];

        i += len;

        found = true;

        break;
      }

    }


    if (!found) {

      result += text[i];

      i++;

    }

  }


  return result;
}

/* =========================================================
   LESSON FILTER
========================================================= */

let selectedLessons = new Set();

function populateLessonFilter() {

  const lessonsWithData =
    new Set(verbs.map(v => v.lesson));

  for (let l = 1; l <= 25; l++) {

    const btn =
      document.createElement("button");

    btn.type = "button";
    btn.textContent = l;
    btn.className = "lesson-btn";
    btn.dataset.lesson = l;

    if (!lessonsWithData.has(l)) {

      btn.classList.add("disabled");
      btn.disabled = true;
      btn.title = "Chưa có động từ mới ở bài này";

    } else {

      btn.addEventListener(
        "click",
        () => toggleLesson(l, btn)
      );
    }

    lessonGrid.appendChild(btn);
  }
}

function toggleLesson(lesson, btn) {

  if (selectedLessons.has(lesson)) {

    selectedLessons.delete(lesson);
    btn.classList.remove("selected");

  } else {

    selectedLessons.add(lesson);
    btn.classList.add("selected");
  }

  applyLessonFilter();

  createQuestion();
}

function selectAllLessons() {

  const buttons =
    lessonGrid.querySelectorAll(
      ".lesson-btn:not(.disabled)"
    );

  buttons.forEach(btn => {

    selectedLessons.add(
      Number(btn.dataset.lesson)
    );

    btn.classList.add("selected");
  });

  applyLessonFilter();

  createQuestion();
}

function clearLessons() {

  selectedLessons.clear();

  lessonGrid
    .querySelectorAll(".lesson-btn")
    .forEach(btn =>
      btn.classList.remove("selected")
    );

  applyLessonFilter();

  createQuestion();
}

function applyLessonFilter() {

  filteredVerbs =
    selectedLessons.size === 0
      ? verbs
      : verbs.filter(
          v => selectedLessons.has(v.lesson)
        );

  if (filteredVerbs.length === 0) {
    filteredVerbs = verbs;
  }
}


/* =========================================================
   CREATE QUESTION
========================================================= */

function createQuestion() {

  const index =
    Math.floor(
      Math.random() * filteredVerbs.length
    );


  currentVerb =
    filteredVerbs[index];


  const from =
    fromForm.value;


  /*
    Hiển thị Kanji
  */

  questionVerb.textContent =
    currentVerb[from].kanji;


  /*
    Hiển thị Hiragana
  */

  verbReading.textContent =
    currentVerb[from].kana;


  meaning.textContent =
    currentVerb.meaning;


  group.textContent =
    `Nhóm ${currentVerb.group} · Bài ${currentVerb.lesson}`;


  /*
    Reset
  */

  answerInput.value = "";

  answerInput.className =
    "answer-input";

  converted.textContent = "";

  result.textContent = "";

  result.className =
    "result";

  correctAnswer.textContent = "";

  checked = false;


  answerInput.focus();
}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer() {

  if (checked) {
    return;
  }


  const input =
    answerInput.value.trim();


  if (!input) {
    return;
  }


  /*
    Romaji → Hiragana
  */

  const userHiragana =
    romajiToHiragana(input);


  /*
    LẤY ĐÁP ÁN HIRAGANA
    KHÔNG LẤY KANJI
  */

  const to =
    toForm.value;


  const expected =
    currentVerb[to].kana;


  /*
    Hiển thị kết quả chuyển đổi
  */

  converted.textContent =
    `→ ${userHiragana}`;


  total++;

  checked = true;


  /*
    SO SÁNH HIRAGANA
  */

  if (
    userHiragana === expected
  ) {

    correct++;


    answerInput.className =
      "answer-input correct";


    result.textContent =
      "✓ Chính xác!";


    result.className =
      "result correct";


    correctAnswer.textContent = "";


  } else {

    answerInput.className =
      "answer-input wrong";


    result.textContent =
      "✕ Chưa chính xác";


    result.className =
      "result wrong";


    /*
      ĐÁP ÁN LUÔN HIỂN THỊ HIRAGANA
    */

    correctAnswer.textContent =
      `Đáp án: ${expected}`;
  }


  updateStats();
}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats() {

  document.getElementById("total")
    .textContent = total;


  document.getElementById("correct")
    .textContent = correct;


  const accuracy =
    total === 0
      ? 0
      : Math.round(
          correct / total * 100
        );


  document.getElementById("accuracy")
    .textContent =
      `${accuracy}%`;


  document.getElementById("progressBar")
    .style.width =
      `${accuracy}%`;
}

/* =========================================================
   UPDATE VISIBILITY
========================================================= */

function updateVisibility() {

  /*
    HIRAGANA
  */

  if (showHiragana) {

    verbReading.classList.remove(
      "info-hidden"
    );

    toggleHiragana.textContent = "👁";

    toggleHiragana.classList.remove(
      "hidden"
    );

  } else {

    verbReading.classList.add(
      "info-hidden"
    );

    toggleHiragana.textContent = "🙈";

    toggleHiragana.classList.add(
      "hidden"
    );
  }


  /*
    MEANING
  */

  if (showMeaning) {

    meaning.classList.remove(
      "info-hidden"
    );

    toggleMeaning.textContent = "👁";

    toggleMeaning.classList.remove(
      "hidden"
    );

  } else {

    meaning.classList.add(
      "info-hidden"
    );

    toggleMeaning.textContent = "🙈";

    toggleMeaning.classList.add(
      "hidden"
    );
  }


  /*
    GROUP
  */

  if (showGroup) {

    group.classList.remove(
      "info-hidden"
    );

    toggleGroup.textContent = "👁";

    toggleGroup.classList.remove(
      "hidden"
    );

  } else {

    group.classList.add(
      "info-hidden"
    );

    toggleGroup.textContent = "🙈";

    toggleGroup.classList.add(
      "hidden"
    );
  }
}


/* =========================================================
   HIRAGANA BUTTON
========================================================= */

toggleHiragana.addEventListener(
  "click",
  () => {

    showHiragana =
      !showHiragana;

    updateVisibility();
  }
);


/* =========================================================
   MEANING BUTTON
========================================================= */

toggleMeaning.addEventListener(
  "click",
  () => {

    showMeaning =
      !showMeaning;

    updateVisibility();
  }
);


/* =========================================================
   GROUP BUTTON
========================================================= */

toggleGroup.addEventListener(
  "click",
  () => {

    showGroup =
      !showGroup;

    updateVisibility();
  }
);


/* =========================================================
   LIVE ROMAJI → HIRAGANA
========================================================= */

answerInput.addEventListener(
  "input",
  () => {

    if (checked) {
      return;
    }


    const value =
      answerInput.value;


    if (!value) {

      converted.textContent = "";

      return;
    }


    const hiragana =
      romajiToHiragana(value);


    converted.textContent =
      `→ ${hiragana}`;
  }
);


/* =========================================================
   ENTER
========================================================= */

answerInput.addEventListener(
  "keydown",
  event => {

    if (event.key !== "Enter") {
      return;
    }


    if (!checked) {

      checkAnswer();

    } else {

      createQuestion();

    }
  }
);


/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("checkBtn")
  .addEventListener(
    "click",
    checkAnswer
  );


document
  .getElementById("nextBtn")
  .addEventListener(
    "click",
    createQuestion
  );


/* =========================================================
   FORM CHANGE
========================================================= */

fromForm.addEventListener(
  "change",
  createQuestion
);


toForm.addEventListener(
  "change",
  createQuestion
);


lessonAllBtn.addEventListener(
  "click",
  selectAllLessons
);


lessonClearBtn.addEventListener(
  "click",
  clearLessons
);


/* =========================================================
   START
========================================================= */

populateLessonFilter();

applyLessonFilter();

updateVisibility();

createQuestion();

</script>

</body>
</html>
